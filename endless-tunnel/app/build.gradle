plugins {
    id("ndksamples.android.application")
}

android {
    namespace 'com.google.sample.tunnel'
    defaultConfig {
        applicationId 'com.google.sample.tunnel'
        versionCode     1
        versionName    '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation project(":base")
}


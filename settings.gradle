pluginManagement {
    // build-logic 是一套独立的 Included Build。放在 pluginManagement 中后，
    // 其中注册的插件 ID 才能在各模块的 plugins {} 中被解析。
    includeBuild("build-logic")
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "NDK Samples"
// 与上面的 includeBuild 不同：这里把 base 加入主构建，成为普通 Gradle 子项目 :base。
include(":base")
include(":bitmap-plasma:app")
include(":camera:basic")
include(":camera:camera-utils")
include(":camera:texture-view")

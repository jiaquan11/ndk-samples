plugins {
    id("ndksamples.android.application")
    id("ndksamples.android.kotlin")
}

android {
    namespace 'com.android.hellovk'

    defaultConfig {
        applicationId 'com.android.hellovk'
        // TODO: Figure out why this isn't 24.
        minSdk 30
        externalNativeBuild {
            cmake {
                // Available arguments are inside ${SDK}/cmake/.../android.toolchain.cmake file
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        shaders {
            glslcArgs.addAll(['-c'])
        }
        ndk {
            // GameActivity doesn't currently (August 2025) include riscv64
            // libraries.
            abiFilters.remove("riscv64")
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildFeatures {
        // 同时消费本地 :base AAR 与 Maven GameActivity AAR 中的 Prefab Package。
        // Gradle 解析两类 AAR，AGP 再把其中的 Native API 暴露给 CMake。
        prefab true
        shaders true
    }
}

dependencies {
    implementation libs.appcompat
    implementation project(":base")
    // 提供 GameActivity 的 Java/Kotlin 与 Native API；CMake 端仍需 find_package。
    implementation libs.androidx.games.gameactivity
}
